# 考法范例库：按"考法结构 × 年级"注入创作 / 规划提示词（features: produce.exemplars）。
# 范例由资深小学数学教师按区统考风格自编（不是教材题，也不是知识库改写题）：情境具体、需要整理信息、答案前有一个针对典型错误的"坑"。
# 每条范例的答案都经手算核对；数据落在该年级的数域内；题面不依赖图或表。
# 字段：grade 年级（1～6）；tags 涉及的知识点；cross 是否跨单元综合；stem 题面（Pandoc Markdown，行内公式用 $…$）；
#       options 选择题选项（可空）；answer 答案；why 好在哪；error 针对的典型错误；sketch 一句话梗概（给规划用，不含数字细节）。
patterns:
  逆向求原数:
    idea: 已知最后的结果和中间发生的变化，倒推最初的量。
    recipe: 把增减的过程说成一件真实的事；至少有一次增加和一次减少（或先打折再减免），倒着做时每一步都要把运算反过来；让"顺着算"得到一个看上去合理的错误答案；可以加一条与所问无关的后续信息作干扰。
    exemplars:
      - id: rev-1
        grade: 1
        tags: 100以内加减法 × 逆向思考
        cross: false
        stem: |-
          星期天，乐乐把贴画册里的贴画送给同桌 $8$ 张，又从姐姐那里得到 $15$ 张，这时贴画册里有 $40$ 张。乐乐原来有多少张贴画？
        answer: 33 张
        why: 把一连串变化倒过来想：先把"得到的 15 张"去掉，再把"送出的 8 张"补回来。一年级学生第一次遇到"从结果倒推"，数据小、过程短，但必须想清楚每一步的方向。
        error: 顺着题目的叙述直接算 40-8+15，或把"送给"和"得到"的加减方向弄反。
        sketch: 先送出又得到，已知最后的张数，求原来有多少
      - id: rev-2
        grade: 2
        tags: 有余数的除法 × 乘加逆向
        cross: false
        stem: |-
          手工课上，淘淘把一捆彩带每 $5$ 条扎成一束，扎了 $8$ 束，还剩 $3$ 条。后来老师又给了他 $9$ 条。淘淘这捆彩带原来有多少条？
        answer: 43 条
        why: 有余数除法的逆运算：被除数 = 商 × 除数 + 余数。"后来给的 9 条"是与所问无关的干扰条件，学生要分清"原来"指哪个时刻。
        error: 只算 $5\times8=40$ 而漏掉剩下的 3 条；或把后来老师给的 9 条也算进"原来"。
        sketch: 按每份几个分成几份还剩几个，倒推总数，并带一个无关的后续条件
      - id: rev-3
        grade: 3
        tags: 万以内加减法 × 逆向思考
        cross: false
        stem: |-
          周末，林林的存钱罐里先存入 $18$ 元，后来取出 $7$ 元买了一本漫画书，最后又存入 $25$ 元，现在罐里共有 $96$ 元。存钱罐里原来有多少元？
        answer: 60 元
        why: 三步变化里有存也有取，倒推时"存入"要减、"取出"要加回，方向各不相同；数据都不大，难点完全在思路而不在计算。
        error: 把"取出"当成"存入"处理，或只倒推一部分步骤；顺着算 $96+18-7+25$。
        sketch: 存取交替的三步变化，已知最后的钱数求原来的钱数
      - id: rev-4
        grade: 6
        tags: 百分数的应用（折扣）× 方程
        cross: false
        stem: |-
          一件运动服先打八折，又用了一张 $20$ 元的优惠券，最后实际付了 $148$ 元。这件运动服的原价是多少元？
        answer: 210 元
        why: 折扣和减免的先后顺序决定了倒推的顺序：先把券的 20 元加回，再除以 $0.8$。可以用方程 $0.8x-20=148$ 求解，也可以倒着算。
        error: 先除以 $0.8$ 再加 $20$（顺序弄反）；或把"打八折"当成"加价 20%"。
        sketch: 先打折再减免，已知实付，求原价

  比较择优:
    idea: 对几个对象在统一的标准下比较，选出更优的一个，并说出优多少。
    recipe: 让表面上显眼的数字（每盒的价钱、盐的克数、物品的件数）指向错误的选项；要比较的量口径不同（每盒的支数不同、单位不同、总量不同），必须先统一再比；两个候选的差距要小但可判断；先问"选哪个"，再问"相差多少"。
    exemplars:
      - id: cmp-1
        grade: 2
        tags: 表内乘除法 × 比较价钱
        cross: false
        stem: |-
          文具店里卖同样的水彩笔：甲店 $6$ 支一盒，每盒 $8$ 元；乙店 $8$ 支一盒，每盒 $9$ 元。美术小组要买 $24$ 支，在哪家店买更便宜？便宜多少元？
        answer: 乙店；便宜 5 元
        why: 两家的"每盒"支数不同，只看每盒价钱会选甲店。要先算出各买几盒、各花多少钱（甲 4 盒 32 元，乙 3 盒 27 元）再比。
        error: 只比每盒的价钱（8 元比 9 元便宜）就选甲店，没有统一买的总支数。
        sketch: 同一商品两种包装，要买固定数量，先算总价再比
      - id: cmp-2
        grade: 3
        tags: 长方形的周长与面积 × 乘法
        cross: true
        stem: |-
          张爷爷用 $24$ 米长的篱笆围一块长方形菜地（篱笆正好围满一圈，长和宽都是整米数）。这块菜地的面积最大是多少平方米？
        answer: 36 平方米
        why: 周长相同的长方形，面积并不相同。要把长 + 宽 = 12 的各种围法列出来比较（11×1、10×2……6×6），发现越接近正方形面积越大。
        error: 以为"周长一样，面积也一样"，或以为"长得越长面积越大"。
        sketch: 固定周长，在各种整数边长里找面积最大的围法
      - id: cmp-3
        grade: 5
        tags: 小数乘法 × 容量单位换算 × 比较
        cross: true
        stem: |-
          超市里同一品牌的牛奶：大盒装每盒 $1.5$ 升，售价 $21$ 元；小盒装每盒 $250$ 毫升，售价 $3.8$ 元。要买同样多的牛奶（$1.5$ 升），买哪种更省钱？省多少元？
        answer: 大盒装；省 1.8 元
        why: 两种包装的容量单位不同（升与毫升），要先统一：1.5 升 = 6 小盒，小盒共 $3.8\times6=22.8$ 元。商品的数据取自生活，差距只有一两元，需要认真算。
        error: 不统一单位直接比 21 元和 3.8 元；或只比较每盒的价钱。
        sketch: 同一商品大小两种包装、单位不同，买同样的总量，比总价
      - id: cmp-4
        grade: 6
        tags: 百分数（含盐率）× 比较
        cross: false
        stem: |-
          甲杯盐水用 $12$ 克盐加 $188$ 克水配成，乙杯盐水用 $15$ 克盐加 $285$ 克水配成。哪杯盐水更咸（含盐率更高）？
        answer: 甲杯（含盐率 6%，乙杯 5%）
        why: 乙杯里的盐更多，但水也多得多。含盐率 = 盐 ÷ 盐水总质量，必须各自算出来再比较。
        error: 看到盐的克数多就选乙杯；或用盐与水的质量比较而不是和盐水总质量比。
        sketch: 两杯溶液，盐多的那杯反而不一定更浓

  方案选择:
    idea: 在人数、钱数、次数等约束下，从几种方案里选出最省、最少或最合适的。
    recipe: 给出 2～3 种计费或搭配方式；约束要卡在边界上（刚好坐满、刚好够用）；最优解不是"全选单价最低的那一种"；方案数不多，可以列举比较；问最优方案的花费或何时某方案才划算。
    exemplars:
      - id: plan-1
        grade: 1
        tags: 人民币 × 20以内加法
        cross: false
        stem: |-
          乐乐有 $20$ 元钱，想正好花完买两样不同的文具：笔袋 $12$ 元、水彩笔 $8$ 元、本子 $6$ 元、尺子 $3$ 元。应该买哪两样？
        options: [笔袋和本子, 笔袋和水彩笔, 水彩笔和本子, 本子和尺子]
        answer: 笔袋和水彩笔
        why: 要在几种价钱里找出"和正好是 20"的一对，需要有顺序地试（先定笔袋，再配另一样），是一年级的"有条理地思考"。
        error: 凭感觉乱凑，或只看总价不超过 20 元就选。
        sketch: 在几种价钱里选两样，正好花完指定的钱数
      - id: plan-2
        grade: 4
        tags: 除法 × 乘法 × 取整 × 方案比较
        cross: true
        stem: |-
          公园里有两种游船：大船每条限乘 $6$ 人，租金 $36$ 元；小船每条限乘 $4$ 人，租金 $20$ 元。$22$ 名同学一起划船，每条船都不能超过限乘人数，大小船可以搭配。最省钱的租法要花多少元？
        answer: 116 元
        why: 小船每人 5 元、大船每人 6 元，看似"全租小船"最省，但 22 不是 4 的倍数，全租小船要 6 条（120 元）；1 条大船加 4 条小船正好坐满，只要 116 元。需要比较几种搭配，不能只看单价。
        error: 只看每人平均租金而全租小船；或全租大船（144 元）；忽略"不能超载"而少租船。
        sketch: 两种船型的租金与限乘人数，人数固定，搭配出最省的租法
      - id: plan-3
        grade: 5
        tags: 小数乘法 × 方程 × 近似数（进一）
        cross: true
        stem: |-
          游泳馆有两种付费方式：方式一，办一张月卡 $120$ 元，每次游泳另付 $6.5$ 元；方式二，不办卡，每次 $11$ 元。这个月至少游泳多少次，办月卡才比不办卡更省钱？
        answer: 27 次
        why: 设游 $x$ 次，$120+6.5x<11x$，解得 $x>26.67$，次数必须是整数，所以至少 27 次。要求学生既会列式，又会根据情境"进一"，并检验 26 次和 27 次的两边。
        error: 把 26.67 四舍五入成 27 却不检验，或取 26 次；忽略办卡费用只比较每次的价钱。
        sketch: 办卡与不办卡两种收费，求至少多少次办卡才划算
      - id: plan-4
        grade: 6
        tags: 百分数（折扣）× 方案比较
        cross: false
        stem: |-
          商场促销同款 T 恤，每件标价 $120$ 元。甲店：全场打八折；乙店：每买两件，第二件半价（买 $3$ 件时，第 $3$ 件按原价）。小丽要买 $3$ 件，选哪家店更省钱？省多少元？
        answer: 甲店；省 12 元
        why: 听起来"第二件半价"比"八折"更划算，但买 3 件时只有一件能半价，平均每件 100 元，反而比八折的每件 96 元贵。需要把两家店的总价各算出来。
        error: 凭印象认为"半价比八折更便宜"；把三件都按半价或都按原价计算。
        sketch: 两种促销规则，买固定件数，比总价

  纠错辨析:
    idea: 给出一位同学的做法和结果（其实是错的），让学生判断对不对，并求出正确结果。
    recipe: 错法必须是该知识点真实、常见的典型错误，表面上像对的；题面写出同学的想法或结果；问"对不对"并要求给出正确的结果（答案是"对/错"加一个数，不要让学生写理由）。
    exemplars:
      - id: fix-1
        grade: 1
        tags: 两位数减一位数（退位）
        cross: false
        stem: |-
          小青计算 $47-9$ 时是这样想的："个位 $7$ 不够减 $9$，就用 $9-7=2$，十位的 $4$ 不变"，所以她得到 $42$。小青算对了吗？$47-9$ 的正确结果是多少？
        answer: 错；38
        why: 小青的想法是退位减法最典型的错误，说得"振振有词"。学生要识破"大数减小数"的习惯，并能用"先减 7 再减 2"或"拆成 40+7 再减"等方法得到正确结果。
        error: 个位不够减时用大数减小数，且十位不退位。
        sketch: 一位同学退位减法的错误想法，判断并改正
      - id: fix-2
        grade: 3
        tags: 三位数乘一位数（中间有 0）
        cross: false
        stem: |-
          小聪计算 $308\times4$，写下的结果是 $1202$。他算对了吗？正确的结果是多少？
        answer: 错；1232
        why: 因数中间的 0 乘 4 得 0，但前一步的进位 3 要加到这一位上。学生可以先估算 $300\times4=1200$，再核对每一位，找出漏掉进位的地方。
        error: 因数中间有 0 时，忘记加上个位乘得的进位。
        sketch: 因数中间有 0 的乘法，同学漏掉了进位
      - id: fix-3
        grade: 4
        tags: 小数加法（数位对齐）
        cross: false
        stem: |-
          小丽计算 $8.4+3.65$ 时，列竖式把两个数的末位对齐，算出结果是 $4.49$。她算对了吗？正确的结果是多少？
        answer: 错；12.05
        why: 结果 4.49 比加数 8.4 还小，这本身就是一个明显的破绽，鼓励学生先用估算检验。错因是小数加减要小数点对齐，而不是末位对齐。
        error: 小数相加时末位对齐而不是小数点对齐。
        sketch: 小数竖式末位对齐的错误，判断并改正
      - id: fix-4
        grade: 6
        tags: 百分数的应用（单位"1"不同）
        cross: false
        stem: |-
          商店把一件原价 $100$ 元的外套先提价 $20\%$，再降价 $20\%$。小林说："这样现价还是 $100$ 元。"他说得对吗？现价是多少元？
        answer: 错；96 元
        why: 提价和降价的单位"1"不同：提价是以原价为标准，降价是以提价后的价格为标准。数据取整，学生可以一步步算出 $120\times0.8=96$，也可以发现两个 20% 不能抵消。
        error: 认为"加了 20% 再减 20% 等于没变"。
        sketch: 先提价再降价同样的百分数，同学认为抵消

  规律探究:
    idea: 从前几项归纳出规律，再用规律求较远的一项或总数。
    recipe: 给出 3 个具体项让学生归纳；所求的项要足够远，不能一个个数出来；故意留一个"直觉陷阱"（相邻图形共用一条边、周期的余数、首尾要不要算）；答案是一个数或一个明确的结论。
    exemplars:
      - id: pat-1
        grade: 2
        tags: 有余数的除法 × 周期问题（星期）
        cross: false
        stem: |-
          今天是星期三，学校通知 $100$ 天后举行运动会。运动会那天是星期几？
        answer: 星期五
        why: 星期每 7 天重复一次，$100\div7=14\cdots\cdots2$，要看余数而不是商：星期三往后数 2 天。把生活里的周期现象和有余数除法联系起来。
        error: 把商当成答案，或认为余数是几就是星期几，忽略起点是星期三。
        sketch: 已知今天星期几，求很多天以后是星期几
      - id: pat-2
        grade: 3
        tags: 找规律 × 乘法
        cross: false
        stem: |-
          用小棒摆一排三角形，相邻的两个三角形共用一根小棒：摆 $1$ 个三角形用 $3$ 根，摆 $2$ 个用 $5$ 根，摆 $3$ 个用 $7$ 根。摆 $12$ 个这样的三角形需要多少根小棒？
        answer: 25 根
        why: 每多摆一个三角形只多用 2 根，而不是 3 根；$12$ 个需要 $3+2\times11=25$ 根。学生要从三个数据里找出"每次增加多少"，再往后推到第 12 个。
        error: 以为每个三角形都用 3 根，算成 $3\times12=36$；或忘了起点的第一个三角形要用 3 根。
        sketch: 连续摆图形相邻共用一根小棒，求第很多个所需的数量
      - id: pat-3
        grade: 4
        tags: 有余数的除法 × 周期排列 × 乘法
        cross: true
        stem: |-
          一串彩灯按"红、红、黄、黄、黄、绿"的顺序一直重复排下去。前 $52$ 盏彩灯中，黄灯有多少盏？
        answer: 26 盏
        why: 6 盏一组，$52\div6=8\cdots\cdots4$：8 组里有 $8\times3=24$ 盏黄灯，余下的 4 盏是"红红黄黄"，还有 2 盏黄灯。余数部分也要逐一看。
        error: 只数整组里的黄灯（24 盏），忘了余数部分里的黄灯。
        sketch: 一组彩灯循环重复，求前若干盏中某种颜色的数量
      - id: pat-4
        grade: 5
        tags: 找规律 × 乘法 × 四则运算
        cross: false
        stem: |-
          艺术节上，舞蹈队的同学围成正方形的空心队列：最外层每边 $5$ 人时共 $16$ 人，每边 $6$ 人时共 $20$ 人，每边 $7$ 人时共 $24$ 人。每边 $20$ 人时共需要多少人？
        answer: 76 人
        why: 每边多 1 人，总数多 4 人，总数 = $4\times(\text{每边人数}-1)$；也可以理解成四个角上的人被数了两次。既要找规律，也要理解规律的道理。
        error: 直接算 $4\times20=80$，忘了四个角上的人被重复数了一次。
        sketch: 空心方阵每边的人数与总人数的关系

  估算与检验:
    idea: 先估算判断够不够、大不大、合不合理，必要时精算验证。
    recipe: 让估算的结果恰好踩在临界值上，或估算的方向偏了（都往大估、π 取 3），使草率的估算得出错误的结论；结论用"够/不够、能/不能"表达，再问差多少或多出多少。
    exemplars:
      - id: est-1
        grade: 3
        tags: 两位数乘两位数 × 质量单位（吨与千克）
        cross: true
        stem: |-
          食堂买来 $21$ 袋大米，每袋 $48$ 千克。一辆载重 $1$ 吨的小货车一次能装下吗？
        answer: 不能（共 1008 千克，超出 8 千克）
        why: 估算 $20\times50=1000$ 恰好等于 1 吨，无法下结论：一个因数估大、一个估小，误差互相抵消又没有裕量。必须精算 $21\times48=1008$，再统一单位（1 吨 = 1000 千克）比较。
        error: 凭估算 1000 千克"刚好"就说能装下；忘记 1 吨 = 1000 千克。
        sketch: 估算恰好等于限载量，必须精算才能判断能不能装下
      - id: est-2
        grade: 4
        tags: 小数加减法 × 估算
        cross: false
        stem: |-
          小宇的购物卡里有 $90$ 元，他想买标价分别为 $18.6$ 元、$29.7$ 元和 $41.2$ 元的三样东西。卡里的钱够吗？如果够，还剩多少元？
        answer: 够；还剩 0.5 元
        why: 把三个价钱四舍五入后加起来恰好是 90 元（19+30+41），估算不能判断够不够，只有精算 $18.6+29.7+41.2=89.5$ 才知道。估算先给出范围，精算给出结论。
        error: 看到估算等于 90 就直接说"够"或"不够"；小数点没对齐算错。
        sketch: 几样东西的小数价钱，估算和恰好等于带的钱数
      - id: est-3
        grade: 6
        tags: 圆的周长 × 估算
        cross: false
        stem: |-
          小区里有一个圆形花坛，直径是 $8$ 米。物业买了 $25$ 米长的栏杆，准备沿花坛边缘围一圈（接头处的长度不计）。栏杆够围一圈吗？
        answer: 不够（周长 25.12 米）
        why: 如果把 π 估成 3，周长约 24 米，得出"够"的错误结论；这里的差距只有 0.12 米，必须按 3.14 精算：$3.14\times8=25.12$。让学生体会估算的方向偏小会导致误判。
        error: 把 π 看作 3 估算，得出 24 米而误判为够用。
        sketch: 圆形物体的周长与材料长度只差一点，估算会误判

  数据分析:
    idea: 用平均数、百分数、票数等统计数据做推断，需要先整理信息、补全缺失的数据。
    recipe: 数据全部写在题面里（不依赖图表），数据个数不多；用到"总数 = 平均数 × 个数"的逆向、加权平均、先补出缺的一项再比较；陷阱是简单平均、漏掉缺失的一项、重复计数。
    exemplars:
      - id: data-1
        grade: 2
        tags: 数据的收集与整理 × 表内加减
        cross: false
        stem: |-
          二（1）班 $45$ 名同学投票选春游的地方，每人只投 $1$ 票：动物园 $17$ 票，植物园 $12$ 票，其余的同学都投给了科技馆。得票最多的是哪里？它比得票第二多的多几票？
        answer: 动物园；多 1 票
        why: 科技馆的票数题目没有直接给出，要先用总人数减去另外两项（$45-17-12=16$）再比较；得票最多的并不是"最后补出来的那一项"，学生要把三项都排一排。
        error: 不去补出科技馆的票数，就拿已知的两项比较；算成别的票数。
        sketch: 总票数与其中两项已知，补出缺的一项再比较
      - id: data-2
        grade: 4
        tags: 平均数 × 逆向思考
        cross: false
        stem: |-
          小红前 $5$ 次一分钟跳绳的成绩分别是 $118$、$125$、$120$、$131$、$126$ 个。她想让 $6$ 次的平均成绩达到 $126$ 个，第 $6$ 次至少要跳多少个？
        answer: 136 个
        why: 先由"平均数 × 次数"求出 6 次的总数 $126\times6=756$，再减去前 5 次的总数 620。把平均数的"求平均"反过来用，这是期末卷里常见的灵活考法。
        error: 直接把 126 当作第 6 次的成绩；或用前 5 次的平均数 124 去推。
        sketch: 已知前几次成绩，要达到目标平均数，求最后一次至少多少
      - id: data-3
        grade: 5
        tags: 平均数 × 加权平均
        cross: false
        stem: |-
          某班数学测验，$20$ 名男生的平均分是 $85$ 分，$30$ 名女生的平均分是 $90$ 分。全班 $50$ 人的平均分是多少分？
        answer: 88 分
        why: 男女生人数不同，全班平均分不是两个平均分的平均：要先分别求出总分 $20\times85+30\times90=4400$，再除以 $50$。
        error: 直接算 $(85+90)\div2=87.5$，忽略了人数不同。
        sketch: 两组人数不同的平均分，求合起来的平均分
      - id: data-4
        grade: 6
        tags: 百分数 × 统计
        cross: false
        stem: |-
          六（1）班 $40$ 人参加兴趣小组，每人只参加一个：书法组占 $25\%$，绘画组占 $35\%$，其余的人参加编程组。编程组比书法组多几人？
        answer: 6 人
        why: 先求出编程组占 $1-25\%-35\%=40\%$，再分别算出两个组的人数（16 人和 10 人）。"其余"的部分题目没有直接给出，要自己补出来。
        error: 忘记编程组的占比要用 1 减去另外两项；把百分数当成人数直接相减。
        sketch: 各小组占比已知两项，其余的一项要补出来再比较人数

  多步混合:
    idea: 一个真实情境里要用到几个知识点，每一步的结果是下一步的条件。
    recipe: 三步以上；至少用到两个不同单元的知识；最后一步要有一个生活里的判断（进一、取整、封闭图形的间隔数）；问题问的不是"最后一步的结果"，而是学生要自己想清楚的那个量。
    exemplars:
      - id: multi-1
        grade: 1
        tags: 20以内加减法 × 比较
        cross: false
        stem: |-
          停车场里原来有 $25$ 辆车，先开走 $8$ 辆，又开来 $12$ 辆。现在停车场里的车比原来多几辆？
        answer: 多 4 辆
        why: 问的不是"现在有多少辆"，而是"和原来比"。可以算出现在 29 辆再比较，也可以直接算 $12-8=4$，两种想法都对。让学生读清楚问题再算。
        error: 算出现在有 29 辆就作答，没有回答所问的"多几辆"。
        sketch: 先减后加的两步变化，问现在和原来的差
      - id: multi-2
        grade: 2
        tags: 有余数的除法 × 表内乘法 × 取整
        cross: true
        stem: |-
          $35$ 名同学去划船，每条船最多坐 $6$ 人，每条船租金 $8$ 元，所有同学都要有座位。至少要付多少元租金？
        answer: 48 元
        why: $35\div6=5\cdots\cdots5$，剩下的 5 人也要有船，所以需要 6 条船；再算租金 $6\times8=48$ 元。把"有余数除法"放进真实问题，余数的处理要靠生活判断。
        error: 只租 5 条船（舍掉余数的 5 人），算成 40 元；或四舍五入后认为余数 5 人不用租船。
        sketch: 总人数与每船限乘人数，租船的条数要进一，再算租金
      - id: multi-3
        grade: 4
        tags: 长方形周长 × 除法 × 植树问题
        cross: true
        stem: |-
          农场里有一块长方形菜地，长 $18$ 米，宽 $12$ 米。工人沿菜地四周每隔 $2$ 米打一根木桩（四个角上也各打一根），一共需要多少根木桩？
        answer: 30 根
        why: 先求周长 $(18+12)\times2=60$ 米，再用间隔数求棵数。围成封闭图形时，木桩数等于间隔数 $60\div2=30$，不用加 1。把周长、除法和植树问题串起来。
        error: 套用"两端都栽"的公式得到 $60\div2+1=31$ 根；只算了一条边。
        sketch: 沿长方形四周等距打桩，求桩数（封闭图形）
      - id: multi-4
        grade: 5
        tags: 小数除法 × 小数乘法 × 近似数（进一）
        cross: true
        stem: |-
          快递公司的收费规则：$1$ 千克以内（含 $1$ 千克）收 $8$ 元；超过 $1$ 千克的部分，每 $0.5$ 千克收 $2.5$ 元，不足 $0.5$ 千克的按 $0.5$ 千克算。寄一个重 $3.2$ 千克的包裹要付多少元？
        answer: 20.5 元
        why: 超出部分 $3.2-1=2.2$ 千克，$2.2\div0.5=4.4$，不足一份的也要按一份收，所以是 5 份，$8+5\times2.5=20.5$ 元。小数除法的商要按生活规则"进一"，而不是四舍五入。
        error: 4.4 份直接四舍五入成 4 份；或用 $2.2\times2.5$ 直接乘；把首重的 1 千克也算进续重。
        sketch: 首重加续重的快递收费，不足一份按一份算
      - id: multi-5
        grade: 6
        tags: 分数除法 × 工程问题
        cross: false
        stem: |-
          一批零件，王师傅单独做要 $12$ 天，李师傅单独做要 $18$ 天。两人合作 $4$ 天后，剩下的由李师傅单独做，还要几天做完？
        answer: 8 天
        why: 把整批零件看作单位"1"，两人每天分别做 $\frac{1}{12}$ 和 $\frac{1}{18}$，合作 4 天完成 $\frac{5}{9}$，剩下 $\frac{4}{9}$ 由李师傅做，需要 $\frac{4}{9}\div\frac{1}{18}=8$ 天。每步的结果都是下一步的条件。
        error: 忘记剩下的部分只有一个人做，仍用合作的效率去除；把工作总量当成具体的数而不是单位"1"。
        sketch: 两人合作一段时间后一人单独完成剩余
