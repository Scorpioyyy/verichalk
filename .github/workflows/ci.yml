name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        working-directory: backend
        run: pyright --pythonpath "$(which python)"
      - name: Tests (no network, no secrets)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          pip install -e "backend[dev]"
          npm ci --prefix frontend
      - name: Generated types match the backend contract
        run: python scripts/gen_types.py --check
      - name: Type check, lint, format, unit tests
        working-directory: frontend
        run: npm run check
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # 端到端：真实后端 + 真实浏览器，模型调用从 eval/cassettes/e2e 回放（无网络、无密钥）
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pip install -e "backend[dev]"
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Build frontend (served by the backend)
        run: npm run build --prefix frontend
      - name: Playwright (replay)
        working-directory: frontend
        env:
          E2E_MODE: replay
          VERICHALK_PYTHON: python
          CI: "true"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
