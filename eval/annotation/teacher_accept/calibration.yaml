  options:
  - 占 $\frac{1}{2}$ 和 $\frac{1}{3}$ 的两个区域
  - 占 $\frac{1}{3}$ 和 $\frac{1}{4}$ 的两个区域
  - 占 $\frac{1}{4}$ 和 $\frac{1}{5}$ 的两个区域
  - 占 $\frac{1}{2}$ 和 $\frac{1}{5}$ 的两个区域
  answer: C
  solution: 相邻单位分数之差满足 $\frac{1}{n}-\frac{1}{n+1}=\frac{1}{n(n+1)}$。$n$ 越大，分母 $n(n+1)$ 越大，分数值越小。比较三组相邻差：$\frac{1}{2\times3}=\frac{1}{6}$，$\frac{1}{3\times4}=\frac{1}{12}$，$\frac{1}{4\times5}=\frac{1}{20}$。因为
