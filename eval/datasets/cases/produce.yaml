# 出题端到端开发集（val：调参、读题、消融都用它；验收用留出集 produce_holdout.yaml）。
# 2026-11-06 重建（eval/CHANGELOG.md）：分布对齐留出集——年级、领域、"教材里只有看图题的主题"约 1/4、
# 请求形式（只说主题与题量为主，难度词 / 情境 / 题型 / 课本式 / 综合 / 边缘各占一小部分）。
# pf-*：上一轮的留出集（2026-11-04 验收时用过一次、失败样本已读过，改作开发数据）；
# pd-*：本次补的 12 例，补齐图形与几何、看图主题与形式要求。主题与措辞避开留出集。
# expect：n_items 题量；topics_any 产出题的知识点名称或题面里应出现的关键词（至少一半的题）；tier_min 各档位至少几道；
# kinds_only 题型必须属于这些；scene_any 情境里应出现的关键词；source 来源；clarify 是否应触发澄清。期望是出题前的已知意图，不是事后标注。
