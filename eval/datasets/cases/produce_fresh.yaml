# **从未用于调参**：只在里程碑验收时跑一次，结果如实报告，失败样本不得回头"修"进提示或规则里去拟合它们。
# 格式与 expect 键同 produce.yaml（n_items / topics_any / tier_min / kinds_only / scene_any / source / clarify）。
