# 模型角色 → 具体模型（D10）。业务代码只写角色，不写模型名。
# 初始值是占位：最终由 docs/evaluation.md §5 的角色级对比评测决定，并记录在 docs/design.md。
# 覆盖方式：环境变量 VERICHALK_MODEL_<ROLE>=<model>（用于临时实验与评测对比），或在 profiles 下写覆盖项。
#
# thinking 必须显式指定（部分模型不传时默认开启思考）；judge 与被评对象不同源，solver 与 smart 不同源。
roles:
  fast:   { model: deepseek-v4.1-flash, thinking: false, temperature: 0.3, max_tokens: 2048 }  # M2 角色对比选定（design.md D29）
  smart:  { model: qwen3.7-plus,        thinking: false, temperature: 0.7, max_tokens: 4096 }  # M3 对比：与 qwen3.8-max 的交付数和一次通过率无差别（74/79 对 46/51），价格约 1/6
  vision: { model: qwen3.8-flash,       thinking: false, temperature: 0.1, max_tokens: 4096 }
  judge:  { model: deepseek-v4.1-flash, thinking: false, temperature: 0.0, max_tokens: 2048 }
  solver: { model: deepseek-v4.1-flash, thinking: false, temperature: 0.0, max_tokens: 2048 }  # 盲解：核验集上思考与否检出相同，非思考更快更省（见 eval/specs/produce.md §8）
  extract: { model: deepseek-v4.1-flash, thinking: false, temperature: 0.0, max_tokens: 1500 }  # 超纲抽取：思考与非思考检出相同，非思考快 4 倍（produce.md §8）

profiles:
  cn: {}
  intl: {}
