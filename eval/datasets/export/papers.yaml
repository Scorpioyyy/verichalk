# 导出评测集（eval/specs/export.md §2）：手工设计的试卷，覆盖公式、版面、图形、特殊字符与边缘情况。
# 说明：id 缺省时由加载器补；`pages` 是教师版 PDF 的页数范围；`expect_error: true` 表示应给出教师可读的导出错误而不是崩溃。
# 公式与图形的期望个数由加载器从内容里数出来，不在这里手写。
# 注：含反斜杠的字符串一律用单引号（YAML 单引号内反斜杠不转义）。

- id: basic_mixed
  tags: [mixed, figures]
  pages: [2, 4]
  paper:
    title: 四年级下册 小数运算 单元练习
    meta: {school: 阳光小学, duration_minutes: 40}
    sections:
      - title: 选择与填空
        items:
          - kind: choice
            stem: '下面哪个数最接近 $3.6$？'
            options: ['3.06', '3.59', '3.7', '3.16']
            answer: B
            solution: '$3.6-3.59=0.01$，差最小。'
            score: 3
          - kind: fill
            stem: '$\frac{3}{4}+\frac{1}{8}=$____，小数 $0.75$ 化成分数是 ____。'
            answer: '7/8；3/4'
            solution: '通分：$\frac{6}{8}+\frac{1}{8}=\frac{7}{8}$。'
            score: 3
          - kind: judge
            stem: '$0.3\times 0.3=0.9$。（　）'
            answer: 错
            solution: '$0.3\times0.3=0.09$。'
            score: 2
          - kind: fill
            stem: |-
              在数轴上，点 A 表示的数是 ____。

              ![](fig:f3)
            answer: '2.5'
            score: 3
            figures:
              - {id: f3, kind: number_line, alt: 数轴, params: {min: 0, max: 4, step: 0.5, points: [{value: 2.5, label: A}]}}
      - title: 计算与应用
        items:
          - kind: calc
            stem: '计算：$12.6-3.45+0.8=$____'
            answer: '9.95'
            solution: '从左往右：$12.6-3.45=9.15$，$9.15+0.8=9.95$。'
            score: 4
          - kind: application
            stem: '小红买了 3 本练习本，每本 $2.5$ 元，她付给收银员 $10$ 元，应找回多少元？'
            answer: '2.5 元'
            solution: '$2.5\times 3=7.5$，$10-7.5=2.5$（元）。'
            score: 6
          - kind: application
            stem: |-
              如图，一个长方形的长是 8 厘米，宽是 5 厘米，它的周长是多少厘米？

              ![](fig:f1)
            answer: '26 厘米'
            solution: '$(8+5)\times 2=26$（厘米）。'
            score: 6
            figures:
              - {id: f1, kind: shape, alt: 长方形, params: {shape: rectangle, labels: {length: 8厘米, width: 5厘米}}}
          - kind: application
            stem: |-
              下面是某班同学喜欢的运动人数统计图，喜欢跳绳的比喜欢足球的多多少人？

              ![](fig:f2)
            answer: '6 人'
            solution: '$18-12=6$（人）。'
            score: 6
            figures:
              - {id: f2, kind: bar_chart, alt: 条形统计图, params: {title: 喜欢的运动, categories: [跳绳, 足球, 篮球, 乒乓球], values: [18, 12, 15, 9], y_step: 5, y_label: 人数}}

- id: formula_dense
  tags: [formulas]
  pages: [1, 3]
  paper:
    title: 分数与小数综合计算
    sections:
      - title: 计算
        items:
          - {kind: calc, stem: '计算：$\frac{2}{3}+\frac{3}{4}-\frac{5}{6}=$____', answer: '7/12', solution: '$\frac{8}{12}+\frac{9}{12}-\frac{10}{12}=\frac{7}{12}$。'}
          - {kind: calc, stem: '计算：$1\frac{1}{2}\times 2\frac{2}{3}\div \frac{4}{9}=$____', answer: '9', solution: '$\frac{3}{2}\times\frac{8}{3}\div\frac{4}{9}=4\div\frac{4}{9}=9$。'}
          - {kind: calc, stem: '解方程：$3x-4.5=7.5$。$x=$____', answer: '4', solution: '$3x=12$，$x=4$。'}
          - {kind: calc, stem: '计算：$(12.5+7.5)\times 0.4-3.2\div 0.8=$____', answer: '4', solution: '$20\times0.4=8$，$3.2\div0.8=4$，$8-4=4$。'}
          - {kind: calc, stem: '简便计算：$25\times 17\times 4=$____', answer: '1700', solution: '$25\times4\times17=100\times17=1700$。'}
          - {kind: fill, stem: '$45\%$ 写成小数是 ____，写成最简分数是 ____。', answer: '0.45；9/20', solution: '$45\%=0.45=\frac{45}{100}=\frac{9}{20}$。'}
          - {kind: fill, stem: '$7\div 3=$____……____', answer: '2；1', solution: '$3\times2=6$，$7-6=1$。'}
          - {kind: fill, stem: '长方体的体积公式 $V=abh$，当 $a=3\text{cm}$，$b=4\text{cm}$，$h=5\text{cm}$ 时，$V=$____$\text{cm}^3$。', answer: '60', solution: '$3\times4\times5=60$。'}
          - {kind: calc, stem: '比较大小：$\frac{3}{5}$ ____ $0.65$（填“>”“<”或“=”）。', answer: '<', solution: '$\frac{3}{5}=0.6<0.65$。'}
          - {kind: fill, stem: '一个角是 $35^\circ$，它的余角是 ____$^\circ$，补角是 ____$^\circ$。', answer: '55；145', solution: '$90-35=55$，$180-35=145$。'}

- id: long_stems
  tags: [long, multi_paragraph]
  pages: [1, 3]
  paper:
    title: 应用题（长题干）
    sections:
      - title: 解决问题
        items:
          - kind: application
            stem: |-
              学校组织三年级和四年级的同学去郊外春游。三年级共有 126 名同学，四年级比三年级多 24 名同学。学校租了若干辆大巴车，每辆车最多坐 45 人，并且每辆车上至少要有 2 名带队老师（老师不占用学生座位）。

              （1）两个年级一共有多少名同学？

              （2）至少需要租几辆大巴车才能让所有同学都有座位？

              （3）如果每辆大巴车的租金是 $680$ 元，学校打算用班费支付，班费一共有 $3\,500$ 元，够不够？请说明理由。
            answer: '（1）276 名；（2）7 辆；（3）不够'
            solution: |-
              （1）四年级有 $126+24=150$（名），一共 $126+150=276$（名）。

              （2）$276\div45=6\cdots\cdots6$，所以至少需要 $6+1=7$（辆）。

              （3）$680\times7=4760$（元），$4760>3500$，所以班费不够。
            score: 12
          - kind: application
            stem: '一辆汽车从甲地开往乙地，前 3 小时每小时行驶 $65$ 千米，后 2 小时每小时行驶 $72$ 千米，已知甲、乙两地相距 $350$ 千米，这辆汽车到达乙地了吗？如果没有，还差多少千米？请写出计算过程，并说明你的理由，要求所有的单位都要写清楚，答案要有完整的语句。'
            answer: '没有，还差 11 千米'
            solution: '$65\times3+72\times2=195+144=339$（千米），$350-339=11$（千米）。'
            score: 8

- id: options_layout
  tags: [choice, layout]
  pages: [1, 2]
  paper:
    title: 选择题版面
    sections:
      - title: 选择题
        items:
          - {kind: choice, stem: '下面的数中，最大的是（　）。', options: ['0.5', '0.49', '0.051', '0.5001'], answer: D, score: 2}
          - {kind: choice, stem: '把 $0.36$ 化成分数是（　）。', options: ['$\frac{36}{10}$', '$\frac{9}{25}$', '$\frac{36}{1000}$', '$\frac{3}{6}$'], answer: B, score: 2}
          - {kind: choice, stem: '下面哪种做法能最方便地算出 $102\times 25$？', options: ['先算 $100\times25$，再算 $2\times25$，最后相加', '先算 $102\times20$，再算 $102\times5$，最后相加', '先把 $25$ 拆成 $5\times5$，再依次相乘', '直接用竖式计算，不能用简便方法'], answer: A, score: 2}
          - {kind: choice, stem: '一个三角形的三个内角度数比是 $1:2:3$，这个三角形是（　）三角形。', options: ['锐角', '直角', '钝角'], answer: B, score: 2}
          - {kind: choice, stem: '下面说法正确的是（　）。', options: ['小数都比整数小', '一个数乘 $0.1$，积一定比这个数小', '两个小数相乘，积一定是小数', '$0$ 乘任何数都得 $0$'], answer: D, score: 2}

- id: blanks_and_brackets
  tags: [blanks]
  pages: [1, 2]
  paper:
    title: 填空与判断
    sections:
      - title: 填空
        items:
          - {kind: fill, stem: '$3.5\text{ m}=$____cm，$2\text{ kg }50\text{ g}=$____kg。', answer: '350；2.05'}
          - {kind: fill, stem: '在（　　）里填上合适的数：$0.7\,\text{L}=$（　　）mL。', answer: '700'}
          - {kind: fill, stem: '一个数由 5 个十、3 个十分之一和 8 个百分之一组成，这个数写作________，读作________。', answer: '50.38；五十点三八'}
          - {kind: judge, stem: '小数的末尾添上 0 或去掉 0，小数的大小不变。（　　）', answer: 错}
          - {kind: judge, stem: '等腰三角形一定是锐角三角形。（　）', answer: 错}

- id: table_in_stem
  tags: [table]
  pages: [1, 2]
  paper:
    title: 统计表
    sections:
      - title: 解决问题
        items:
          - kind: application
            stem: |-
              下表是三（2）班同学最喜欢的水果的统计结果。

              | 水果 | 苹果 | 香蕉 | 橙子 | 西瓜 |
              |---|---|---|---|---|
              | 人数 | 12 | 9 | 7 | 14 |

              （1）喜欢西瓜的比喜欢香蕉的多多少人？

              （2）全班一共有多少人？
            answer: '（1）5 人；（2）42 人'
            solution: '（1）$14-9=5$（人）。（2）$12+9+7+14=42$（人）。'
            score: 8

