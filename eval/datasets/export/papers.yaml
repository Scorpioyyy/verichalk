- id: all_figures
  tags: [figures]
  pages: [1, 3]
  paper:
    title: 图形题
    sections:
      - title: 看图解答
        items:
          - kind: application
            stem: |-
              如图，一个三角形的底是 10 厘米，高是 6 厘米，面积是多少平方厘米？

              ![](fig:t1)
            answer: '30'
            figures:
              - {id: t1, kind: shape, alt: 三角形, params: {shape: triangle, labels: {base: 10厘米, height: 6厘米}}}
          - kind: application
            stem: |-
              平行四边形的底是 12 厘米，高是 7 厘米，面积是多少？

              ![](fig:p1)
            answer: '84'
            figures:
              - {id: p1, kind: shape, alt: 平行四边形, params: {shape: parallelogram, labels: {base: 12厘米, height: 7厘米, side: 8厘米}}}
          - kind: application
            stem: |-
              梯形的上底 4 厘米，下底 10 厘米，高 5 厘米，面积是多少？

              ![](fig:z1)
            answer: '35'
            figures:
              - {id: z1, kind: shape, alt: 梯形, params: {shape: trapezoid, labels: {top: 4厘米, bottom: 10厘米, height: 5厘米}}}
          - kind: fill
            stem: |-
              图中涂色部分有 ____ 格，补全这个轴对称图形。

              ![](fig:g1)
            answer: '7'
            figures:
              - {id: g1, kind: grid, alt: 方格图, params: {rows: 6, cols: 10, shaded: [[1, 1], [1, 2], [2, 1], [3, 1], [3, 2], [4, 1], [5, 1]], axis: {orientation: vertical, at: 5}}}
          - kind: fill
            stem: |-
              用数对表示：点 A 的位置是（____，____）。

              ![](fig:g2)
            answer: '（3，4）'
            figures:
              - {id: g2, kind: grid, alt: 坐标方格, params: {rows: 6, cols: 8, coordinate: true, points: [{x: 3, y: 4, label: A}, {x: 6, y: 2, label: B}]}}
          - kind: application
            stem: |-
              圆的半径是 5 厘米，直径是多少？

              ![](fig:c1)
            answer: '10 厘米'
            figures:
              - {id: c1, kind: shape, alt: 圆, params: {shape: circle, labels: {radius: 5厘米}}}

