  stem: 三年级一班去郊游，共有61人。大车每辆限乘30人。如果先坐满一辆大车，剩下的人全部坐小车，至少需要多少辆小车？
  options: []
  answers: ['4']
  gold: []
  solution: 先坐满一辆大车，可乘30人。剩下人数为61-30=31（人）。每辆小车限乘8人，31÷8=3（辆）……7（人），余下的7人还需1辆小车，所以至少需要3+1=4辆小车。答案是4。
