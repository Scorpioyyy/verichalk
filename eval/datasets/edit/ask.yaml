# 追问评测集（eval/specs/edit.md §2.4，指标 S7）：基础试卷 `papers.yaml: base8`。
# expect：判官要检查的"回答应当做到什么"；另有全局检查：回答与题目给出的答案 / 解析不矛盾。
- {id: ask-1, q: 第6题为什么答案是2.5元？, expect: 解释先算 3 本练习本的总价 7.5 元，再用 10 元减去得 2.5 元}
- {id: ask-2, q: 第1题为什么选A？, expect: 说明 0.6×5=3，对应选项 A}
- {id: ask-3, q: 第7题怎么做？, expect: 用三角形内角和 180° 减去已知的两个角，得 67 度}
- {id: ask-4, q: 第5题考什么知识点？, expect: 指出考查解两步方程（先加后除或等式性质），不是别的知识点}
- {id: ask-5, q: 第4题这道题难在哪？, expect: 指出小数加减混合运算要注意从左往右、小数点对齐、退位}
- {id: ask-6, q: 第8题还有别的解法吗？, expect: 给出另一种合理的算法（如以 100 为基准、各数与 100 的差再平均），结果仍是 103}
- {id: ask-7, q: 第2题的答案是对的吗？, expect: 确认"对"是正确的，并说明三角形内角和是 180°}
- {id: ask-8, q: 第3题怎么讲给学生听？, expect: 给出适合四年级学生的讲法（如每支 1.5 元、6 支就是 6 个 1.5 相加或 1.5×6）}
- {id: ask-9, q: 第6题学生容易错在哪？, expect: 指出可能的易错点（如忘记用付款减总价、小数乘法点错小数点、单位）}
- {id: ask-10, q: 第7题超纲吗？, expect: 说明三角形内角和是四年级学习的内容，不超纲；不得编造具体课时页码}
- {id: ask-11, q: 第5题能不能不用方程做？, expect: 给出不用方程的思路（如倒推：7.5 加 4.5 再除以 3），答案仍是 4}
- {id: ask-12, q: 第8题的平均数是什么意思？, expect: 解释平均数是把总数平均分，表示一般水平，结合本题}
- {id: ask-13, q: 第1题的干扰项是怎么设计的？, expect: 解释干扰项来自常见错误（如小数点位置点错：0.3、30，或 3.5）}
- {id: ask-14, q: 第4题为什么要从左往右算？, expect: 解释同级运算（加减）按从左往右顺序计算}
- {id: ask-15, q: 第6题的单位是什么？, expect: 回答单位是元}
- {id: ask-16, q: 第7题为什么不能直接用180减65？, expect: 解释还有一个角 48° 也要减去，三个内角之和才是 180°}
- {id: ask-17, q: 这道题怎么做？, expect: 因为没说是哪一题，应请教师指明是第几题（或基于概览询问），不能随意挑一道讲}
- {id: ask-18, q: 第12题怎么做？, expect: 指出试卷里没有第 12 题（只有 8 道题），不编造}
- {id: ask-19, q: 第3题的答案是不是10？, expect: 指出答案应是 9（1.5×6=9），纠正教师的说法}
- {id: ask-20, q: 第8题的答案是不是104个？, expect: 指出答案是 103 个并给出计算，纠正教师的说法}
